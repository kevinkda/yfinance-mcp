[project]
name = "yfinance-mcp"
version = "0.0.0+dev"
description = "Read-only MCP server for Yahoo Finance data (splits, earnings calendar, financials, analyst recommendations) via yfinance. Supplements schwab/polygon/sec-edgar gaps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "kevinkda" }]
keywords = ["mcp", "yfinance", "yahoo-finance", "finance", "read-only"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp>=1.6,<2.0",
    "yfinance>=1.2,<2.0",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "duckdb>=1.0,<2.0",
    # numpy is pulled transitively by yfinance/pandas; cap below 2.3 so the
    # resolver lands on a version that ships manylinux wheels for this
    # toolchain (numpy>=2.3 only offers an sdist here and requires GCC>=9.3).
    "numpy>=2.0,<2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=7.1.0,<8",
    "respx>=0.22.0,<0.24",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.7,<5",
    "detect-secrets>=1.5,<2",
]

[project.scripts]
yfinance-mcp = "yfinance_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kevinkda/yfinance-mcp"
Issues = "https://github.com/kevinkda/yfinance-mcp/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yfinance_mcp"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/yfinance_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "last: ensure this test runs after others (used by coverage assertion).",
    "posix_only: test depends on POSIX file-permission semantics; skipped on Windows.",
    "network: test makes a real yfinance network call; skipped by default in CI.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:yfinance.*",
    "ignore::DeprecationWarning:pandas.*",
    "ignore::FutureWarning:yfinance.*",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/yfinance_mcp"]
omit = [
    "src/yfinance_mcp/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
]
fail_under = 100
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["build", "dist", ".venv", "htmlcov"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "S",
    "RUF", "PL", "PIE", "PT", "RET", "TID", "ASYNC",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "S101",
    "TID252",
    "PLC0415",
    "PT011",
    "B017",
    "PT006",
    "RET504",
    "S311",
    "PLW0603",
    "RUF012",
    "RUF059",
    "ASYNC240",
    "SIM105",
    "SIM117",
    "PT018",
    "PT019",
    "PLR0911",
    "PLR0915",
    "PLW0108",
    "S108",
    "S103",
    "S603",
    "S105",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true
show_error_codes = true
exclude = ["build/", "dist/", ".venv/", "htmlcov/"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "mcp.*", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
skips = ["B101"]
